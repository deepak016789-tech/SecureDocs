services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: securedocs_backend

    restart: unless-stopped

    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      KEY_URL: ${KEY_URL}
      JWT_ALGORITHM: ${JWT_ALGORITHM}

volumes:
  securedocs_data: